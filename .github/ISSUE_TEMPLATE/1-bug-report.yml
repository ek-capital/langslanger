name: 🐞 Bug report
description: Report a reproducible LangSlanger bug.
title: "[Bug] "
labels: ["bug"]

body:
- type: checkboxes
  attributes:
    label: Checklist
    options:
      - label: I searched related issues but found no solution.
      - label: The bug persists on the latest LangSlanger main branch.
      - label: Issues without environment info and a minimal reproducible demo are hard to resolve and may receive no feedback.
      - label: Please use English. Otherwise, it will be closed.
- type: textarea
  attributes:
    label: Describe the bug
    description: A clear, concise description of the bug.
  validations:
    required: true
- type: textarea
  attributes:
    label: Reproduction
    description: Command/script run and model used.
    placeholder: Paste the command here.
  validations:
    required: true
- type: textarea
  attributes:
    label: Environment
    description: Run `python3 -m sglang.check_env` and paste the output, plus the LangSlanger Git commit.
    placeholder: Paste environment output here.
  validations:
    required: true
