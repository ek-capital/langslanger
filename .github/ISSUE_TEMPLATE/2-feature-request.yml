name: 🚀 Feature request
description: Suggest a LangSlanger experiment or capability.
title: "[Feature] "

body:
- type: checkboxes
  attributes:
    label: Checklist
    options:
      - label: I searched existing LangSlanger issues and pull requests.
      - label: Please use English. Otherwise, it will be closed.
- type: textarea
  attributes:
    label: Motivation
    description: |
      Clearly and concisely describe the feature's motivation.
  validations:
    required: true
- type: textarea
  attributes:
    label: Related resources
    description: |
      Provide profiles, benchmarks, papers, upstream work, or third-party implementations if available.
